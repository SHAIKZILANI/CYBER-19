spring.application.name=vulnerability-assessment-platform
server.port=8081

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/cyber_vulnerability_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Crawler Discovery Configuration
crawler.max-depth=3
crawler.max-pages=100
crawler.request-timeout-seconds=5

# SQL Injection Engine Configuration
sqli.enabled=true
sqli.max-endpoints=50
sqli.max-parameters-per-endpoint=10
sqli.request-timeout-seconds=5

# Cross-Site Scripting (XSS) Engine Configuration
xss.enabled=true
xss.max-endpoints=50
xss.max-parameters-per-endpoint=10
xss.request-timeout-seconds=5

# OWASP ZAP Integration Configuration
zap.enabled=true
zap.base-url=http://localhost:8080
zap.target-url=http://localhost:3000
zap.api-key=
zap.timeout-seconds=60
zap.scan-mode=BASELINE


